 document.getElementById('app').innerHTML=`<div class="shell"><aside><a class="brand" href="#BU04"><span class="logo">✦</span>AI Hub</a><div class="workspace"><b>Acme Operations⌄</b>Business workspace</div><div><div class="nav-label">WORKSPACE</div><nav class="nav" aria-label="Main navigation">${nav.map(([name,target,symbol])=>`<a href="#${target}" class="${activeNav(screen[0])===target?'active':''}">${icon(symbol)}${name}${target==='BU20'?'<small>3</small>':''}</a>`).join('')}</nav></div><div class="nav nav-bottom"><a href="#BU28">${icon('chart')}My usage</a><a href="#BU30">${icon('help')}Help and feedback</a><a href="#BU29">${icon('gear')}Preferences</a></div><div class="side-note">Connected knowledge.<br>Work you can follow through.</div></aside><div class="main"><header class="topbar"><a class="search" href="#BU05">${icon('search')}Search your workspace</a><div class="top-right"><a href="#BU27" aria-label="Notifications" class="icon-btn">${icon('bell')}</a><a class="person" href="#BU29"><span class="avatar">AM</span><span>Alex Morgan<small>Business User</small></span></a></div></header><main class="content"><div class="crumb">Acme Operations <span>/</span> ${screen[2]}</div>${views[screen[0]]()}<div class="view-note">Synthetic design content · ${screen[0]} · ${screen[1]}</div></main></div></div>`;
 window.scrollTo(0,0);
}
document.getElementById('screen-picker').innerHTML=screens.map(([id,title])=>`<option value="${id}">${id} · ${title}</option>`).join('');
document.getElementById('screen-picker').addEventListener('change',event=>{location.hash=event.target.value});
window.addEventListener('hashchange',render);
let toastTimer;
document.addEventListener('click',event=>{
 const toast=event.target.closest('[data-toast]');
 if(toast){const target=document.getElementById('toast');target.textContent=toast.dataset.toast;target.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>target.classList.add('hidden'),4000)}
 const filter=event.target.closest('[data-filter]');
 if(filter){document.querySelectorAll('[data-filter]').forEach(button=>button.classList.toggle('selected',button===filter));document.querySelectorAll('#app-catalog article').forEach(card=>card.classList.toggle('hidden',filter.dataset.filter!=='all'&&!card.textContent.includes(filter.dataset.filter)))}
 const requestFilter=event.target.closest('[data-request-filter]');
 if(requestFilter){document.querySelectorAll('[data-request-filter]').forEach(button=>button.classList.toggle('selected',button===requestFilter));document.querySelectorAll('#request-table tbody tr').forEach(row=>row.classList.toggle('hidden',requestFilter.dataset.requestFilter!=='all'&&!row.textContent.includes(requestFilter.dataset.requestFilter)))}
 if(event.target.closest('[data-export]')){const text='SYNTHETIC DESIGN PREVIEW\nWeekly operations briefing\n\nPriorities\n1. Confirm the vendor review owner.\n2. Resolve the access request.\n3. Review the recurring support incident.\n\nSources\n[1] Weekly operations report, version 3\n[2] Incident response guide, version 2\n';const url=URL.createObjectURL(new Blob([text],{type:'text/plain'}));const a=document.createElement('a');a.href=url;a.download='sample-operations-briefing.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
});
document.addEventListener('change',event=>{if(event.target.id==='document-file'){document.getElementById('file-name').textContent=event.target.files[0]?.name||'No file selected. Files stay on your device in this preview.'}});
render();
</script>
